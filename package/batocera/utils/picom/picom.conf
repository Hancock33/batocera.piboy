#################################
#       Batocera Settings       #
#################################

# Core Engine
backend = "egl";
vsync = true;

# Disable desktop effects to save GPU cycles for the emulator
shadow = false;
fading = false;
blur-background = false;
corner-radius = 0;   # remove if picom rejects it

# Performance
use-damage = true;

# Unredirect fullscreen windows when possible (picom keeps running)
unredir-if-possible = true;

# Keep compositing the transparent bezel overlay despite _NET_WM_BYPASS_COMPOSITOR
rules = ( { unredir = "when-possible-else-terminate"; } );
