# PiBoy DMG - power options, all also available in the System Settings menu.
# Reloaded live by the piboy service.
[power]
# cpu_governor : powersave (Eco) | schedutil (Normal, default) | performance
cpu_governor = schedutil

# Save the running RetroArch game (a new save state slot) before a power-switch
# or empty-battery shutdown: 1 = on (default), 0 = off
save_on_shutdown = 1

# Low battery warning on screen while discharging:
#   10 = at 10% and 7% (default) | 15 = at 15% and 10% | 20 = at 20% and 10% | 0 = off
low_battery_warning = 10

# Turn the display off when the EmulationStation screensaver starts
# (about 450 mA saved): 1 = on (default), 0 = off
screen_off_standby = 1
