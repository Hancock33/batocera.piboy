# PiBoy DMG - fan settings (PWM, driven by the piboy service)
# Save the file: the change applies within a few seconds, no restart needed.
# Above 80 C the fan always runs at full speed, whatever the profile.

[fan]
# profile : silent | quiet | balanced | cool | custom
#   silent   - off at idle, only kicks in at 68 C+
#   quiet    - off at idle, gentle ramp (default)
#   balanced - always spinning a little, comfortable temperatures
#   cool     - vendor curve, coolest but loudest
#   custom   - uses 'curve' below
profile = quiet

# custom only: temperature_C:duty pairs (duty 0-255, 255 = 100 %)
# curve = 60:80, 68:120, 74:175, 80:255

# Idle speed (0-255), optional, overrides the profile. 0 = fan fully off.
# idle_duty = 0
