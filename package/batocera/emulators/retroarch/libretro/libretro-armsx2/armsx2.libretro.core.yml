shared_features:
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
custom_features:
  # System
  lr_armsx2_fast_boot:
    group: SYSTEM
    prompt: BIOS FAST BOOT
    description: Skip the BIOS boot animation, may cause default language issues.
    choices:
      Enabled (Default): enabled
      Disabled: disabled
  lr_armsx2_cheats:
    group: SYSTEM
    prompt: CHEATS
    description: Load .patch cheat files from the pcsx2/cheats folder for the running game.
    choices:
      Disabled (Default): disabled
      Enabled: enabled
  # Display
  lr_armsx2_resolution:
    group: DISPLAY
    prompt: RENDERING RESOLUTION
    description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
    choices:
      1x Native (Default): 1x
      2x Native (~720p): 2x
      3x Native (~1080p): 3x
      4x Native (~1440p/2K): 4x
  lr_armsx2_texture_filtering:
    group: DISPLAY
    prompt: TEXTURE FILTERING
    description: Enhancement. Smooth/upscale textures on 3D objects.
    choices:
      Nearest: Nearest
      Bilinear (Forced): Bilinear (Forced)
      Bilinear (PS2) (Default): Bilinear (PS2)
      Bilinear (Forced excluding sprites): Bilinear (Forced excluding sprites)
  lr_armsx2_trilinear_filtering:
    group: DISPLAY
    prompt: TRILINEAR FILTERING
    description: Control the texture's trilinear filtering of the emulation.
    choices:
      Automatic (Default): Automatic
      'Off': 'Off'
      Trilinear (PS2): Trilinear (PS2)
      Trilinear (Forced): Trilinear (Forced)
  lr_armsx2_anisotropic:
    group: DISPLAY
    prompt: ANISOTROPIC FILTERING
    description: Improves clarity of distant textures.
    choices:
      'Off (Default)': '0'
      2x: '2'
      4x: '4'
      8x: '8'
      16x: '16'
  lr_armsx2_dithering:
    group: DISPLAY
    prompt: DITHERING
    description: Reduces banding between colors and improves the perceived color depth.
    choices:
      Unscaled (Default): Unscaled
      'Off': 'Off'
      Scaled: Scaled
  lr_armsx2_blending:
    group: DISPLAY
    prompt: BLENDING ACCURACY
    description: The higher the setting, the more blending is emulated in the shader accurately, and the higher the speed penalty will be.
    choices:
      Minimum: Minimum
      Basic (Default): Basic
      Medium: Medium
      High: High
      Full: Full
      Maximum: Maximum
file_extensions:
  - iso
  - mdf
  - nrg
  - bin
  - img
  - dump
  - gz
  - cso
  - chd
  - zso
systems:
  - name: ps2
