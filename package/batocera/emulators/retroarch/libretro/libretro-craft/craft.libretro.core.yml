custom_features:
  # Display
  craft_resolution:
    group: DISPLAY
    prompt: RESOLUTION
    description: Applies on restart.
    choices:
      320x240: 320x240
      640x480 (Default): 640x480
      800x600: 800x600
      1024x768: 1024x768
      1280x720: 1280x720
      1280x800: 1280x800
      1600x900: 1600x900
      1920x1080: 1920x1080
      1920x1200: 1920x1200
      2560x1600: 2560x1600
      3840x2400: 3840x2400
  craft_field_of_view:
    group: DISPLAY
    prompt: FIELD OF VIEW
    choices:
      65 (Default): '65'
      '70': '70'
      '75': '75'
      '80': '80'
      '90': '90'
      '100': '100'
      '110': '110'
      '120': '120'
      '135': '135'
      '150': '150'
  craft_draw_distance:
    group: DISPLAY
    prompt: DRAW DISTANCE
    choices:
      '4': '4'
      '6': '6'
      '8': '8'
      10 (Default): '10'
      '12': '12'
      '16': '16'
      '20': '20'
      '24': '24'
      '28': '28'
      '32': '32'
  craft_show_info_text:
    group: DISPLAY
    prompt: SHOW INFO TEXT
    choices:
      Disabled (Default): disabled
      Enabled: enabled
  # Controls
  craft_inverted_aim:
    group: CONTROLS
    prompt: INVERTED AIM
    choices:
      Disabled (Default): disabled
      Enabled: enabled
  craft_analog_sensitivity:
    group: CONTROLS
    prompt: RIGHT ANALOG SENSITIVITY
    choices:
      0.0150 (Default): '0.0150'
      '0.0200': '0.0200'
      '0.0250': '0.0250'
      '0.0300': '0.0300'
      '0.0350': '0.0350'
      '0.0400': '0.0400'
      '0.0450': '0.0450'
      '0.0500': '0.0500'
  craft_deadzone_radius:
    group: CONTROLS
    prompt: ANALOG DEADZONE SIZE
    choices:
      0.010 (Default): '0.010'
      '0.025': '0.025'
      '0.050': '0.050'
      '0.075': '0.075'
      '0.100': '0.100'
      '0.150': '0.150'
      '0.200': '0.200'
  # Game Options
  craft_jumping_flash_mode:
    group: GAME OPTIONS
    prompt: JUMPING FLASH MODE
    choices:
      Disabled (Default): disabled
      Enabled: enabled
file_extensions:
  - game
systems:
  - craft
