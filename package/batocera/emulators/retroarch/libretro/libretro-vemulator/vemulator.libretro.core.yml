custom_features:
  # System
  vemulator_enable_flash_write:
    group: SYSTEM
    prompt: FLASH WRITE
    description: Save changes back to .bin flash images. Applies on restart.
    choices:
      Enabled (Default): enabled
      Disabled: disabled
file_extensions:
  - vms
  - dci
  - bin
systems:
  - vemulator
