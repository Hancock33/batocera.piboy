      - ccd
      - iso
      - img
      - chd
  - name: supergrafx
    file_extensions:
      - pce
      - sgx
      - bin
      - zip
      - 7z
  - name: tg16
    file_extensions:
      - pce
      - bin
      - zip
      - 7z
  - name: tg-cd
