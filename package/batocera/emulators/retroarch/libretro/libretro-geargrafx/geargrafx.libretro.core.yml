      'Off (Default)': Disabled
      'On': Enabled
  geargrafx_turbo_speed_p1_ii:
    group: CONTROLS
    prompt: P1 TURBO II SPEED
    description: Frames between toggles. Lower is faster.
    choices:
      '1': '1'
      '2': '2'
      '3': '3'
      4 (Default): '4'
      '5': '5'
      '6': '6'
      '7': '7'
      '8': '8'
      '9': '9'
