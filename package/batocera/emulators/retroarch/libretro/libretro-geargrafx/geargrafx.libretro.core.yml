      '11': '11'
      '12': '12'
      '13': '13'
      '14': '14'
      '15': '15'
  geargrafx_turbo_p2_i:
    group: CONTROLS
    prompt: P2 TURBO I
    choices:
      'Off (Default)': Disabled
      'On': Enabled
  geargrafx_turbo_speed_p2_i:
    group: CONTROLS
    prompt: P2 TURBO I SPEED
    description: Frames between toggles. Lower is faster.
    choices:
      '1': '1'
      '2': '2'
      '3': '3'
      4 (Default): '4'
      '5': '5'
      '6': '6'
      '7': '7'
      '8': '8'
      '9': '9'
      '10': '10'
      '11': '11'
      '12': '12'
      '13': '13'
      '14': '14'
      '15': '15'
  geargrafx_turbo_p2_ii:
    group: CONTROLS
    prompt: P2 TURBO II
    choices:
      'Off (Default)': Disabled
      'On': Enabled
  geargrafx_turbo_speed_p2_ii:
    group: CONTROLS
    prompt: P2 TURBO II SPEED
    description: Frames between toggles. Lower is faster.
    choices:
      '1': '1'
      '2': '2'
      '3': '3'
      4 (Default): '4'
      '5': '5'
      '6': '6'
      '7': '7'
      '8': '8'
      '9': '9'
      '10': '10'
      '11': '11'
      '12': '12'
      '13': '13'
      '14': '14'
      '15': '15'
  # Advanced Options
  geargrafx_cpu_overclock:
    group: ADVANCED OPTIONS
    prompt: CPU OVERCLOCK
    description: Not recommended.
    choices:
      100% (Default): 100%
      110%: 110%
      120%: 120%
      130%: 130%
      140%: 140%
      150%: 150%
      175%: 175%
      200%: 200%
      250%: 250%
      300%: 300%
  geargrafx_safe_vdc_defaults:
    group: ADVANCED OPTIONS
    prompt: SAFE VDC DEFAULTS
    description: Helps some homebrew run correctly.
    choices:
      'Off (Default)': Disabled
      'On': Enabled
  geargrafx_cdrom_preload:
    group: ADVANCED OPTIONS
    prompt: PRELOAD CD-ROM
    description: Load all tracks into RAM. Applies on restart.
    choices:
      'Off (Default)': Disabled
      'On': Enabled
  geargrafx_deterministic_netplay:
    group: ADVANCED OPTIONS
    prompt: DETERMINISTIC NETPLAY
    choices:
      'Off (Default)': Disabled
      'On': Enabled
