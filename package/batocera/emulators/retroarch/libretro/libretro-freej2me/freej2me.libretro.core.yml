custom_features:
  # System
  freej2me_resolution:
    group: SYSTEM
    prompt: PHONE RESOLUTION
    description: May need a restart.
    choices:
      96x65: 96x65
      101x64: 101x64
      101x80: 101x80
      128x128: 128x128
      130x130: 130x130
      120x160: 120x160
      128x160: 128x160
      160x128: 160x128
      132x176: 132x176
      208x173: 208x173
      176x208: 176x208
      176x220: 176x220
      220x176: 220x176
      208x208: 208x208
      220x220: 220x220
      180x320: 180x320
      320x180: 320x180
      240x240: 240x240
      240x260: 240x260
      208x320: 208x320
      240x320 (Default): 240x320
      320x240: 320x240
      240x400: 240x400
      400x240: 400x240
      320x320: 320x320
      240x432: 240x432
      240x480: 240x480
      360x360: 360x360
      352x416: 352x416
      480x320: 480x320
      360x480: 360x480
      480x360: 480x360
      360x640: 360x640
      640x360: 640x360
      480x640: 480x640
      640x480: 640x480
      345x800: 345x800
      800x345: 800x345
      480x800: 480x800
      800x480: 800x480
      480x854: 480x854
      854x480: 854x480
  freej2me_dojaversion:
    group: SYSTEM
    prompt: DOJA API VERSION
    choices:
      DoJa-1.0: 10DoJa-1.0
      DoJa-2.0 & 1.5 OE: '20'
      DoJa-3.0 & 2.5 OE: '30'
      DoJa-3.5: '35'
      DoJa-4.0: '40'
      DoJa-4.1: '41'
      DoJa-5.0: '50'
      DoJa-5.1: '51'
      Star-1.0: '100'
      Star-1.1: '110'
      Star-1.2: '120'
      Star-1.3: '130'
      Star-1.5: '150'
      Star-2.0 (Default): '200'
  freej2me_fps:
    group: SYSTEM
    prompt: GAME FPS LIMIT
    choices:
      Disabled: Auto
      60 FPS (Default): '60'
      55 FPS: '55'
      50 FPS: '50'
      45 FPS: '45'
      40 FPS: '40'
      35 FPS: '35'
      30 FPS: '30'
      25 FPS: '25'
      20 FPS: '20'
      15 FPS: '15'
      10 FPS: '10'
  # Display
  freej2me_rotate:
    group: DISPLAY
    prompt: ROTATE SCREEN
    choices:
      'Off (Default)': '0'
      90 Degrees: '90'
      180 Degrees: '180'
      270 Degrees: '270'
  freej2me_backlightcolor:
    group: DISPLAY
    prompt: LCD BACKLIGHT COLOR
    choices:
      Disabled: Disabled
      Green (Default): Green
      Cyan: Cyan
      Orange: Orange
      Violet: Violet
      Red: Red
  freej2me_textfont:
    group: DISPLAY
    prompt: TEXT FONT
    description: Custom uses a font placed in the freej2me_system folder.
    choices:
      Default (Default): 'off'
      Custom: 'on'
  freej2me_fontoffset:
    group: DISPLAY
    prompt: FONT SIZE OFFSET
    choices:
      '-4 pt': '-4'
      '-3 pt': '-3'
      '-2 pt': '-2'
      '-1 pt': '-1'
      0 pt (Default): '0'
      1 pt: '1'
      2 pt: '2'
      3 pt: '3'
      4 pt: '4'
  # Audio
  freej2me_sound:
    group: AUDIO
    prompt: PHONE SOUND
    description: Applies on restart.
    choices:
      'On (Default)': 'on'
      'Off': 'off'
  freej2me_midifont:
    group: AUDIO
    prompt: MIDI SOUNDFONT
    description: Custom uses a soundfont placed in the freej2me_system folder.
    choices:
      Default (Default): 'off'
      Custom: 'on'
  freej2me_numsynths:
    group: AUDIO
    prompt: MIDI SYNTHESIZERS
    choices:
      4 (Default): '4'
      '3': '3'
      '2': '2'
      '1': '1'
  # Controls
  freej2me_phone:
    group: CONTROLS
    prompt: PHONE KEY LAYOUT
    choices:
      Default (Default): Default
      BlackBerry 8xxx/9xxx: BlackBerry89
      KDDI: KDDI
      LG: LG
      Motorola Triplets: Motorola Triplets
      Motorola V8: Motorola V8
      Motorola A1000: Motorola A1000
      Nokia Full Keyboard: Nokia Full Keyboard
      Sagem: Sagem
      Siemens: Siemens
      SKT: SKT
  freej2me_analogasentirekeypad:
    group: CONTROLS
    prompt: ANALOG AS ENTIRE KEYPAD
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_pointertype:
    group: CONTROLS
    prompt: POINTER TYPE
    choices:
      Mouse (Default): Mouse
      Touchscreen: Touch
      None (Joypad Analog): None
  freej2me_pointerxspeed:
    group: CONTROLS
    prompt: POINTER X SPEED
    choices:
      Slow: '2'
      Normal (Default): '4'
      Fast: '8'
      Faster: '16'
  freej2me_pointeryspeed:
    group: CONTROLS
    prompt: POINTER Y SPEED
    choices:
      Slow: '2'
      Normal (Default): '4'
      Fast: '8'
      Faster: '16'
  freej2me_pointerinnercolor:
    group: CONTROLS
    prompt: POINTER INNER COLOR
    choices:
      Black: Black
      Red: Red
      Green: Green
      Blue: Blue
      Yellow: Yellow
      Pink: Pink
      Cyan: Cyan
      White (Default): White
  freej2me_pointeroutercolor:
    group: CONTROLS
    prompt: POINTER OUTLINE COLOR
    choices:
      Black (Default): Black
      Red: Red
      Green: Green
      Blue: Blue
      Yellow: Yellow
      Pink: Pink
      Cyan: Cyan
      White: White
  freej2me_pointerclickcolor:
    group: CONTROLS
    prompt: POINTER CLICK COLOR
    choices:
      Black: Black
      Red: Red
      Green: Green
      Blue: Blue
      Yellow (Default): Yellow
      Pink: Pink
      Cyan: Cyan
      White: White
  # Advanced Options
  freej2me_m3gantialiasmode:
    group: ADVANCED OPTIONS
    prompt: M3G ANTI-ALIASING
    choices:
      Always Disabled: 'off'
      App Controlled (Default): app
      Force Enabled: 'on'
  freej2me_m3gbilinearmode:
    group: ADVANCED OPTIONS
    prompt: M3G BILINEAR FILTERING
    choices:
      Always Disabled: 'off'
      App Controlled (Default): app
      Force Enabled: 'on'
  freej2me_m3gditheringmode:
    group: ADVANCED OPTIONS
    prompt: M3G DITHERING
    choices:
      Always Disabled: 'off'
      App Controlled (Default): app
      Force Enabled: 'on'
  freej2me_m3gperspcorrmode:
    group: ADVANCED OPTIONS
    prompt: M3G PERSPECTIVE CORRECTION
    choices:
      Always Disabled: 'off'
      App Controlled (Default): app
      Force Enabled: 'on'
  freej2me_m3gperspcorrfact:
    group: ADVANCED OPTIONS
    prompt: M3G PERSPECTIVE CORRECTION QUALITY
    choices:
      Extra (4 Pixels): extra
      High (8 Pixels) (Default): high
      Average (16 Pixels): medium
      Low (32 Pixels): low
  freej2me_m3gmipmapmode:
    group: ADVANCED OPTIONS
    prompt: M3G MIPMAPPING
    choices:
      Always Disabled: 'off'
      App Controlled (Default): app
      Force Nearest: nearest
      Force Linear: linear
  freej2me_m3gdisablefog:
    group: ADVANCED OPTIONS
    prompt: M3G DISABLE FOG
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_spdhackm3ghalfres:
    group: ADVANCED OPTIONS
    prompt: M3G HALF RESOLUTION
    description: Speed hack.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_spdhackmcv3halfres:
    group: ADVANCED OPTIONS
    prompt: MASCOTCAPSULE V3 HALF RESOLUTION
    description: Speed hack.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_spdhackmcv3nolight:
    group: ADVANCED OPTIONS
    prompt: MASCOTCAPSULE V3 NO LIGHTING
    description: Speed hack.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_spdhacknoalpha:
    group: ADVANCED OPTIONS
    prompt: 'NO ALPHA ON BLANK IMAGES'
    description: Speed hack. Applies on restart.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_spdhackfpsunlock:
    group: ADVANCED OPTIONS
    prompt: FRAMERATE UNLOCK HACK
    choices:
      'Off (Default)': '0'
      Safe: '1'
      Extended: '2'
      Aggressive: '3'
  freej2me_compatfantasyzonefix:
    group: ADVANCED OPTIONS
    prompt: FANTASY ZONE 176X208 FIX
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compattranstooriginongfxreset:
    group: ADVANCED OPTIONS
    prompt: TRANSLATE TO ORIGIN ON GFX RESET
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compatimmediaterepaintcalls:
    group: ADVANCED OPTIONS
    prompt: IMMEDIATE CANVAS REPAINTS
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compatrepaintonsetcurrent:
    group: ADVANCED OPTIONS
    prompt: REPAINT ON DISPLAY SETCURRENT
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compatnotranslatedrawrgb:
    group: ADVANCED OPTIONS
    prompt: DON'T TRANSLATE DRAWRGB CALLS
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compatoverrideplatcheck:
    group: ADVANCED OPTIONS
    prompt: OVERRIDE MOBILE PLATFORM CHECKS
    description: Compatibility fix.
    choices:
      'On (Default)': 'on'
      'Off': 'off'
  freej2me_compatsiemensfriendlydraw:
    group: ADVANCED OPTIONS
    prompt: SIEMENS-FRIENDLY DRAWING
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compatignorevolumechanges:
    group: ADVANCED OPTIONS
    prompt: IGNORE VOLUME CHANGES
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_compatmcv3horfovfix:
    group: ADVANCED OPTIONS
    prompt: MASCOTCAPSULE V3 HORIZONTAL FOV FIX
    description: Compatibility fix.
    choices:
      'Off (Default)': 'off'
      'On': 'on'
  freej2me_deletetempkjxfiles:
    group: ADVANCED OPTIONS
    prompt: DELETE KJX TEMPORARY JAR/JAD
    choices:
      'On (Default)': 'on'
      'Off': 'off'
file_extensions:
  - jar
systems:
  - j2me
