features:
  - netplay
  - padtokeyboard
shared_features:
  - autosave
  - rewind
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
custom_features:
  # System
  geolith_system_type:
    group: SYSTEM
    prompt: SYSTEM TYPE
    choices:
      AES (Home Console) (Default): aes
      MVS (Arcade): mvs
      Universe BIOS (Cheats): uni
  geolith_region:
    group: SYSTEM
    prompt: REGION
    choices:
      USA (Default): us
      Japan: jp
      Asia: as
      Europe: eu
file_extensions:
  - neo
systems:
  - neogeomvs
