name: Combine README and Packages Changelog

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"
      - "docs/PackagesChangelog.md"
      - "PackagesChangelog.md"
      - ".github/workflows/combine-readme-changelog.yml"

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Combine README.md and PackagesChangelog.md
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "docs/PackagesChangelog.md" ]; then
            changelog="docs/PackagesChangelog.md"
          elif [ -f "PackagesChangelog.md" ]; then
            changelog="PackagesChangelog.md"
          else
            echo "Error: PackagesChangelog.md not found (checked docs/ and repo root)" >&2
            exit 1
          fi

          mkdir -p combined
          {
            cat README.md
            echo
            echo "---"
            echo
            echo "## Packages Changelog"
            echo
            echo "_Source: \`${changelog}\`_"
            echo
            cat "$changelog"
          } > combined/README-and-PackagesChangelog.md

          echo "Combined document written to combined/README-and-PackagesChangelog.md"

      - name: Upload combined document
        uses: actions/upload-artifact@v4
        with:
          name: readme-and-packages-changelog
          path: combined/README-and-PackagesChangelog.md
          if-no-files-found: error
