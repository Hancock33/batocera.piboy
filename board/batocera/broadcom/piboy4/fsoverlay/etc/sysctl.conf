# hide any kernel messages from the console
kernel.printk = 3 3 3 3

# SD card: start writeback early and cap dirty memory so a big flush
# cannot stall the system mid-game
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 50331648

# no watermark boosting, it causes reclaim bursts on a low-memory board
vm.watermark_boost_factor = 0
