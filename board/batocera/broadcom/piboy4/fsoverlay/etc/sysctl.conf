# increase limit for steam users (harmless; only a ceiling)
vm.max_map_count = 2147483642

# hide any kernel messages from the console
kernel.printk = 3 3 3 3

# no swap is used (noswap in cmdline.txt), so this has no effect unless zram/swap is added
vm.swappiness = 10
vm.watermark_boost_factor = 0

# keep ~12MB free to avoid reclaim stalls without wasting scarce RAM
vm.watermark_scale_factor = 50

# small write-back limits: avoids multi-second stalls on slow SD cards and limits data loss on power cut
vm.dirty_bytes = 67108864
vm.dirty_background_bytes = 33554432

fs.inotify.max_user_instances = 1024
